# /etc/pkg.conf: pkg(8) configuration. See pkg.conf(5).
#
# NextBSD's pkg reads this file from /private/etc/pkg.conf and its
# repositories from /private/etc/pkg/ and then /usr/local/etc/pkg/repos/.
# The NextBSD repository is /etc/pkg/NextBSD.conf. NextBSD publishes only
# base packages; pkg itself only ever comes from the NextBSD repository.
# FreeBSD's repository is unsupported and not configured; see the wiki's
# Installing-Packages page if you add one yourself.
#
# ABI is not set: NextBSD's pkg works it out itself as NextBSD:27:amd64 or
# NextBSD:27:aarch64 (OS from kern.ostype, version from kern.osrelease).
# Setting ABI here would also need OSVERSION and would pin one architecture.
#
# The NextBSD repository is a rolling snapshot; its OS version stamp
# should not stop an install.
IGNORE_OSVERSION = yes;
