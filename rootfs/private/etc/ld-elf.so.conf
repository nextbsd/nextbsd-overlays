# Extra directories ldconfig(8) folds into /var/run/ld-elf.so.hints, in this
# order, after the system directories. rtld's compiled-in default search path
# already has the same order (nextbsd #278), so this file only matters once a
# package has run `service ldconfig restart` and a hints file exists: rtld
# searches the hints before its default path.
#
# /usr/X11 is the base X11 stack (E23). It comes before /usr/local/lib so a
# program built for FreeBSD finds base's libX11.so.6, libGL.so.1 and the rest
# rather than a second copy from packages. Directories that do not exist are
# skipped.
/usr/X11/lib
/usr/local/lib
