# The NextBSD package repository: the rolling continuous-<MACHINE> release
# of nextbsd/nextbsd-pkg. ${MACHINE} is amd64 or arm64, derived from pkg's
# ABI (see pkg.conf(5)). pkg itself only ever comes from this repository.
#
# Its priority is above any repository a user adds in
# /usr/local/etc/pkg/repos/ (the default is 0), so a package that both
# offer comes from NextBSD.
NextBSD: {
  url: "https://github.com/nextbsd/nextbsd-pkg/releases/download/continuous-${MACHINE}",
  enabled: yes,
  signature_type: none,
  priority: 100
}
