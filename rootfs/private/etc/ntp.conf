#
# /etc/ntp.conf - time sync for the org.nextbsd.ntpd LaunchDaemon
# (E18 U5, nextbsd/nextbsd-userland#251).
#
# FreeBSD's default shape: the FreeBSD pool, a restrictive default policy,
# and a drift file. The leapfile line FreeBSD adds is left out because base
# ships no /var/db/ntpd.leap-seconds.list.
#
# The job is Disabled by default; turn it on with
#   launchctl load -w /System/Library/LaunchDaemons/org.nextbsd.ntpd.plist
#

tos minclock 3 maxclock 6

pool 0.freebsd.pool.ntp.org iburst
pool 2.freebsd.pool.ntp.org iburst

# A directory server joined with `dscli join` becomes the preferred source,
# so file times on the /Network mounts agree with the server. dscli owns
# the lines between the markers; `dscli leave` empties them again.
# BEGIN dscli directory server (managed by dscli join and leave; do not edit)
# END dscli directory server

restrict default limited kod nomodify notrap noquery nopeer
restrict source  limited kod nomodify notrap noquery
restrict 127.0.0.1
restrict ::1

driftfile /var/db/ntpd.drift
