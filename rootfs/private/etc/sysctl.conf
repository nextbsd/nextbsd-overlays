# /etc/sysctl.conf: kernel settings applied at every boot.
#
# As on Darwin, launchctl applies this file during the system bootstrap
# (apply_sysctls_from_file in launchctl.c): each line that is not blank or a
# comment is run as `sysctl -w <line>`. Write one name=value per line, with no
# trailing comment. On a normal boot the output goes to /dev/null; only a
# verbose boot (boot -v) shows it on the console.

# Which kernel drivers deliver keyboard and mouse events to evdev(4), which X
# reads through libinput (nextbsd/nextbsd-xlibre#2, nextbsd/nextbsd#482).
# Bits: 1 sysmouse, 2 kbdmux, 4 mouse hardware (psm, ums), 8 keyboard
# hardware (atkbd, ukbd, hkbd). The kernel default is 12.
#
# 6 = kbdmux + mouse hardware:
#   - keyboards: one "System keyboard multiplexer" device that exists from
#     boot and carries every keyboard, including ones attached after X starts
#     (USB, Bluetooth). NextBSD has no input hotplug yet, so per-keyboard
#     devices plugged in later would never reach X;
#   - mice: one device per mouse, so libinput (and the Mouse settings) see the
#     real hardware. USB HID mice (hms) deliver whatever the mask says;
#   - sysmouse is off, so nothing reaches X twice.
# The console reads keyboards through kbd(4), not evdev, so it is unaffected.
kern.evdev.rcpt_mask=6
