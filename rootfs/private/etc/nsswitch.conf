#
# nsswitch.conf(5) - name service switch configuration file
#
# passwd and group: the DirectoryServices plists first
# (/Local or /Network Library/DirectoryServices/{Users,Groups}.plist, via
# nss_directory_services from nextbsd-userland), then /etc/master.passwd
# and /etc/group for root and the system users.
#
group: directory_services files
hosts: files dns
netgroup: compat
networks: files
passwd: directory_services files
shells: files
services: compat
services_compat: nis
protocols: files
rpc: files
